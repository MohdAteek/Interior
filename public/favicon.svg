<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8CF"/>
      <stop offset="35%" stop-color="#D8B98B"/>
      <stop offset="70%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#8F6E43"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C22"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#D8B98B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Architectural Border Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.65"/>
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.4"/>

  <!-- JS Monogram Emblem -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Letter J: Elegant hook with architectural vertical stem -->
    <path d="M 23 18 L 33 18 L 33 21 L 29.5 21 L 29.5 37.5 C 29.5 41.5 27.2 44.5 22.8 44.5 C 19.5 44.5 17 42.5 16.2 39.8 L 19.5 38.6 C 20 40.2 21.2 41.6 22.8 41.6 C 24.8 41.6 26.2 40.2 26.2 37.2 L 26.2 21 L 23 21 Z"/>
    
    <!-- Letter S: Interlocking architectural curves -->
    <path d="M 44.5 24.8 L 41.5 26.2 C 40.8 24.2 39.2 23 36.8 23 C 34.2 23 32.5 24.3 32.5 26.3 C 32.5 28.1 33.9 29.1 37 30.1 C 41.6 31.6 44.8 33.3 44.8 37.6 C 44.8 42.1 41.2 44.8 36.4 44.8 C 32 44.8 29.2 42.4 28.2 39.2 L 31.3 37.8 C 32 40.1 33.8 41.8 36.4 41.8 C 39.1 41.8 41.4 40.3 41.4 37.8 C 41.4 35.6 39.8 34.6 36.5 33.4 C 32.1 31.8 29.2 30.3 29.2 26.3 C 29.2 22.2 32.4 20 36.7 20 C 40.3 20 43.4 22 44.5 24.8 Z"/>

    <!-- Small Accent Diamond at top right -->
    <polygon points="46,15 48,17 46,19 44,17" opacity="0.9"/>
  </g>
</svg>
